name: Publish catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

# Access control lives in the repo's Pages settings: set visibility to
# "Private" (GitHub Enterprise) so only org members can reach the catalog.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node packages/cli/bin/agent-hub.js build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v4
